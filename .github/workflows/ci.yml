name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (ktlint)
        run: scripts/ktlint.sh

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      # The debug build is shrunk with R8 like the Play build. Fail if R8 removed something
      # WorkManager creates by reflection (the cause of the 1.0.25 widget stuck loading).
      - name: Check R8 kept reflection-created classes
        run: scripts/check-r8-keeps.sh

      - name: Android Lint
        run: ./gradlew --stacktrace lintDebug

      # Release builds use their own App Check provider (src/release), so compile that code too.
      - name: Compile release code
        run: ./gradlew --stacktrace compileReleaseKotlin

      - name: Check Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema files changed during the build. Commit the files under app/schemas."
            git status --porcelain app/schemas
            for f in $(git status --porcelain --untracked-files=all app/schemas | awk '{print $2}'); do
              echo "----- $f"
              cat "$f"
            done
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
