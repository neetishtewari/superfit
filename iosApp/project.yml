# The iPhone app's Xcode project, generated by XcodeGen (brew install xcodegen; cd iosApp; xcodegen).
# The .xcodeproj is not committed: edit this file instead, then run xcodegen again.
name: Superfit
options:
  bundleIdPrefix: com.superfit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # The App Store version people see, and the build number (raised for every upload).
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Neetish's Apple Developer team goes here (Xcode > Signing & Capabilities), not in the repo.
    DEVELOPMENT_TEAM: ""
# Google's own Firebase iPhone SDK (Swift Package Manager). Products are added as each part
# (sign-in, backup, AI) moves over.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
  # Google's own sign-in sheet for iPhone (Continue with Google).
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"
targets:
  Superfit:
    type: application
    platform: iOS
    sources:
      # Includes PrivacyInfo.xcprivacy, Apple's privacy manifest: what the app collects and why it
      # uses settings storage, file dates and the phone's uptime. The App Store needs it.
      - Superfit
      # Names shared with the widget (app group, link key).
      - SuperfitWidget/WidgetKeys.swift
      # Manrope, the app's font, for the report PDF (the same files the shared screens use).
      - path: ../shared/src/commonMain/composeResources/font
        buildPhase: resources
    dependencies:
      # The home-screen widget, built and embedded with the app.
      - target: SuperfitWidget
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAI
      # Anonymous usage counts and crash reports (Settings › Privacy switch, off in Debug builds).
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: Superfit/Superfit.entitlements
      properties:
        # App Attest proves requests come from the real Superfit app (App Check), like Play
        # Integrity on Android.
        com.apple.developer.devicecheck.appattest-environment: production
        # Sign in with Apple (Continue with Apple on the sign-in screen).
        com.apple.developer.applesignin: [Default]
        # Apple Health, read only (steps, energy, distances, sleep, workouts, workout heart rate,
        # weight, body fat, lean mass).
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Shared with the widget only: today's calorie numbers and the widget's link key.
        com.apple.security.application-groups: [group.com.superfit.aifitness]
    info:
      path: Superfit/Info.plist
      properties:
        CFBundleDisplayName: Superfit
        UILaunchScreen: {}
        # Manrope for drawing the report PDF (copied in from the shared fonts above).
        UIAppFonts: [manrope_regular.ttf, manrope_medium.ttf, manrope_bold.ttf, manrope_extrabold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Usage counts and crash reports start off; UsageReportsBridge turns them on only when the
        # person's Settings › Privacy switch is on, and never in Debug builds. No advertising ID,
        # no ad personalisation.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FirebaseCrashlyticsCollectionEnabled: false
        GOOGLE_ANALYTICS_ADID_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        # Compose Multiplatform draws at the screen's full refresh rate (ProMotion).
        CADisableMinimumFrameDurationOnPhone: true
        # Shown in Apple's Health access sheet. Superfit only reads; it never writes to Apple Health.
        NSHealthShareUsageDescription: "Superfit reads your steps, active calories, distances, sleep, workouts and heart rate during workouts, your height, and weigh-ins with body measurements from your scale, to show your day, set your step goal and targets, and guide your coach. It never changes anything in Apple Health."
        NSHealthUpdateUsageDescription: "Superfit only reads from Apple Health. It never adds or changes anything there."
        # Shown when a mic button is first tapped. The sound goes to Apple's speech recognition and
        # only the words come back; nothing is recorded or kept.
        NSMicrophoneUsageDescription: "Superfit listens when you tap a mic button, so you can say what you ate or the workout you did. Nothing is recorded or kept."
        NSSpeechRecognitionUsageDescription: "Apple's speech recognition turns what you say into words, which Superfit uses to log your meal or workout. Nothing is recorded or kept."
        # Shown the first time the camera opens (meal photo, barcode or label). Photos go to the AI
        # once and are never saved.
        NSCameraUsageDescription: "Superfit uses the camera when you snap your meal, scan a barcode or snap a nutrition label, to work out what you ate. Photos aren't saved."
        # Shown only if the person picks "Save Image" on a share card's share sheet. Superfit only
        # adds that one picture; it never reads the photo library (the card's photo picker needs no access).
        NSPhotoLibraryAddUsageDescription: "Superfit saves the share card you made to your photos when you choose Save Image. It never reads your photo library."
        # Google's sign-in sheet returns to the app through this link (REVERSED_CLIENT_ID in
        # GoogleService-Info.plist). It identifies the app, it is not a secret.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.797661593902-pustbaj3606h9qdt5jeo0tq0epeqp03n
          # The widget's mic, camera and open links (superfit://). The mic and camera only act
          # with the widget's own key (WidgetBridge.swift).
          - CFBundleURLSchemes:
              - superfit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superfit.aifitness
        # The home-screen icon: the Play Store icon cropped to fill the tile (Assets.xcassets/AppIcon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # The shared Kotlin code, built by Gradle in the step below.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        # The Gradle step below reads and writes files outside the app folder.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build shared Kotlin code
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      # Sends the Release build's symbol file to Crashlytics so crash reports show code lines.
      # Debug builds don't report, so they skip it.
      - name: Upload symbols for crash reports
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
  # Home-screen and lock-screen widget: today's calories left, with mic and camera buttons.
  SuperfitWidget:
    type: app-extension
    platform: iOS
    sources:
      - SuperfitWidget
    entitlements:
      path: SuperfitWidget/SuperfitWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.superfit.aifitness]
    info:
      path: SuperfitWidget/Info.plist
      properties:
        CFBundleDisplayName: Superfit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superfit.aifitness.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
